function batchSetFeatureStates({ //batching experiment
  data,
  source,
  sourceLayer,
  batchSize = 1000,
  delay = 50,
  propertyParser = (f) => ({
    density: Number(f["DUA"]),
    useCode: f["use"],
    SiteAddress: f["SiteAddress"],
    description: f["UseDesc"]
  })
}) {
  let i = 0;

  function processNextBatch() {
    const batch = data.slice(i, i + batchSize);
    batch.forEach(f => {
      const id = f.LOC_ID?.toString();
      if (!id || !f["DUA"]) return; // Skip invalid or missing data

      map.setFeatureState(
        { source, sourceLayer, id },
        propertyParser(f)
      );
    });

    i += batchSize;
    if (i < data.length) {
      setTimeout(processNextBatch, delay); // Yield to keep UI responsive
    } else {
      console.log(`✅ Finished setting feature state for ${data.length} features.`);
    }
  }

  processNextBatch();
}

async function computeStatsFromSource(source_url, property) {
  try {
    const response = await fetch(source_url);
    const data = await response.json();

    // Determine structure
    let features;

    if (data.type === "FeatureCollection" && Array.isArray(data.features)) {
      features = data.features;
    } else if (Array.isArray(data)) {
      // JSON as array of objects (not GeoJSON)
      features = data.map(d => ({ properties: d }));
    } else if (data.data && Array.isArray(data.data)) {
      // Nested JSON with .data
      features = data.data.map(d => ({ properties: d }));
    } else {
      console.warn("Unsupported data format or source is a vector tileset.");
      return null;
    }

    // Extract numeric values
    const values = features
      .map(f => Number(f.properties[property]))
      .filter(v => !isNaN(v))
      .sort((a, b) => a - b);

    if (values.length < 5) {
      console.warn("Not enough valid values to compute breaks.");
      return null;
    }

    // Quantile function
    function quantile(arr, q) {
      const pos = (arr.length - 1) * q;
      const base = Math.floor(pos);
      const rest = pos - base;
      return arr[base + 1] !== undefined
        ? arr[base] + rest * (arr[base + 1] - arr[base])
        : arr[base];
    }

    const Q1 = quantile(values, 0.25);
    const median = quantile(values, 0.5);
    const Q3 = quantile(values, 0.75);
    const IQR = Q3 - Q1;

    return [median - 1.5 * IQR, Q1, median, Q3, median + 1.5 * IQR];
  } catch (err) {
    console.error("Failed to compute stats:", err);
    return null;
  }
}

// Compute quintile breaks (for 5 color classes)
async function computeQuintileBreaks(source, property) {
  try {
    const response = await fetch(source);
    const data = await response.json();

    let features;
    if (data.type === "FeatureCollection" && Array.isArray(data.features)) {
      features = data.features;
    } else if (Array.isArray(data)) {
      features = data.map(d => ({ properties: d }));
    } else if (data.data && Array.isArray(data.data)) {
      features = data.data.map(d => ({ properties: d }));
    } else {
      console.warn("Unsupported data format for quintile breaks.");
      return null;
    }

    const values = features
      .map(f => Number(f.properties[property]))
      .filter(v => !isNaN(v))
      .sort((a, b) => a - b);

    if (values.length < 5) {
      console.warn("Not enough valid values to compute quintile breaks.");
      return null;
    }

    function quantile(arr, q) {
      const pos = (arr.length - 1) * q;
      const base = Math.floor(pos);
      const rest = pos - base;
      return arr[base + 1] !== undefined
        ? arr[base] + rest * (arr[base + 1] - arr[base])
        : arr[base];
    }

    // Return quintile breaks: 20th, 40th, 60th, 80th, 100th percentiles
    // Round each break to the nearest 10
    return [
      Math.round(quantile(values, 0.2) / 10) * 10,
      Math.round(quantile(values, 0.4) / 10) * 10,
      Math.round(quantile(values, 0.6) / 10) * 10,
      Math.round(quantile(values, 0.8) / 10) * 10,
      Math.round(quantile(values, 1.0) / 10) * 10
    ];
  } catch (err) {
    console.error("Failed to compute quintile breaks:", err);
    return null;
  }
}

function generateColorStopsFromStats(breaks, colors) {
  if (!breaks || breaks.length !== colors.length) return null;

  const stops = [];
  for (let i = 0; i < breaks.length; i++) {
    stops.push(breaks[i], colors[i]);
  }

  return stops; // just the flat array of input/output pairs
}

    async function addInterpolatedLayers(opacity, visibleLayerId) {
  for (const { id, property, data_source, source_layer, source_url, colors, defaultViz, useFeatureState, useQuintiles, useCustomBreaks, customBreaks } of interpolateLayers) {
    console.log(`Processing layer: ${id}`);

    const expressionInput = useFeatureState
      ? ["feature-state", property]
      : ["get", property];

    let fillColorExpression;

    // Handle custom breaks
    if (useCustomBreaks && customBreaks) {
      const stops = [];
      // For step: first color is default (< first break), then iterate through breaks
      for (let i = 0; i < customBreaks.length && i + 1 < colors.length; i++) {
        stops.push(customBreaks[i], colors[i + 1]);
      }
      fillColorExpression = [
        "step",
        expressionInput,
        colors[0],  // default color for values < first break
        ...stops
      ];
    } else {
      // Use quintile breaks if specified, otherwise use default IQR-based breaks
      const stats = useQuintiles
        ? await computeQuintileBreaks(source_url, property)
        : await computeStatsFromSource(source_url, property);

      if (!stats) {
        console.warn(`Skipping ${id} – insufficient data.`);
        continue;
      }

      const stops = generateColorStopsFromStats(stats, colors);
      if (!stops) {
        console.warn(`Invalid stops for ${id}`);
        continue;
      }

      fillColorExpression = [
        "interpolate",
        ["linear"],
        expressionInput,
        ...stops
      ];
    }

    if (!map.getSource(data_source)) {
      console.error(`Source ${data_source} not found for layer ${id}`);
      continue;
    }

    if (map.getLayer(id)) {
      console.warn(`Layer ${id} already exists, skipping addLayer.`);
      continue;
    }

    const layerConfig = {
      id,
      type: "fill",
      source: data_source,
      layout: {
        visibility: id === visibleLayerId ? "visible" : defaultViz || "none"
      },
      paint: {
        "fill-color": fillColorExpression,
        "fill-outline-color": "white",
        "fill-opacity": [
          "case",
          ["any",
            ["==", useFeatureState ? ["feature-state", property] : ["get", property], null],
            ["==", useFeatureState ? ["feature-state", property] : ["get", property], ""]
          ], 0,  // fully transparent if null or empty string
          opacity || 0.7  // default opacity
        ]
      }
    };

    // Only add source-layer if it exists (for vector tiles)
    if (source_layer) {
      layerConfig["source-layer"] = source_layer;
    }

    map.addLayer(layerConfig, labelLayerId);

    console.log(`Layer ${id} added.`);
  }
}

function getStopsFromLayer(layerId) {
  let expression = map.getPaintProperty(layerId, 'fill-color');

  // Deal with case statements, check for 'interpolate', 'step', or 'match'
  if (Array.isArray(expression) && expression[0] === 'case') {
    expression = expression.find(
      sub => Array.isArray(sub) && ['interpolate', 'step', 'match'].includes(sub[0])
    );
  }

  if (!Array.isArray(expression)) return [];

  const type = expression[0];
  //  Handle 'match'
  if (type === 'match') {
    const stops = expression.slice(2, -1); // skip 'match', ['get', ...], and default color
    const result = [];

    for (let i = 0; i < stops.length; i += 2) {
      result.push({
        value: stops[i],
        color: stops[i + 1]
      });
    }

    return result;
  }

  // Handle 'interpolate' or 'step' expressions
  if (type === 'interpolate' || type === 'step') {
    const result = [];

    if (type === 'step') {
      // For step: ["step", input, defaultColor, threshold1, color1, threshold2, color2, ...]
      const defaultColor = expression[2];
      const stops = expression.slice(3);

      // Get the first threshold value
      const firstThreshold = stops.length > 0 ? stops[0] : 0;

      // Add an entry for the default color (values below first threshold)
      // Use 0 or a representative value to mark this as the "less than" range
      result.push({
        value: 0,
        color: defaultColor,
        isDefaultStep: true,
        upperBound: firstThreshold
      });

      // Add the rest of the thresholds
      for (let i = 0; i < stops.length; i += 2) {
        result.push({
          value: stops[i],
          color: stops[i + 1]
        });
      }
    } else {
      // For interpolate: ["interpolate", type, input, value1, color1, value2, color2, ...]
      const stops = expression.slice(3);
      for (let i = 0; i < stops.length; i += 2) {
        result.push({
          value: stops[i],
          color: stops[i + 1]
        });
      }
    }

    return result;
  }

  return [];
}

const percentLayers = ['tracts-pctCostBurdenedRenters', 'tracts-pctCostBurdenedOwners', 'tracts-pctHH', 'zips-chZhvi', 'bg-costs-2veh-owner'];
const currencyLayers = ['tracts-medIncome', 'zips-zhvi', 'bg-costs-HT', 'bg-costs-HT-owner', 'bg-costs-ownership', 'bg-costs-rental', 'bg-costs-transport'];
const numberLayers  = ['tracts-rdAge', 'tracts-rdRace', 'parcels-density'];

// Update formatting by way of layerId 
function formatLegendLabel(value, layerId) {
  if (typeof value !== 'number') return value; // If not numeric, is treated as normal

  // Percents
  if (percentLayers.includes(layerId)) {
    return `${Math.round(value * 100)}%`;
  }

  // Currency
  if (currencyLayers.includes(layerId)) {
    // For bg-costs layers, values are already rounded to nearest 10, so don't round further
    if (layerId === 'bg-costs-HT' || layerId === 'bg-costs-HT-owner' || layerId === 'bg-costs-ownership' || layerId === 'bg-costs-rental' || layerId === 'bg-costs-transport') {
      return `$${Math.round(value).toLocaleString()}`;
    }
    // For other currency layers, round to nearest 1000 if >= 1500
    if (value >= 1500) {
      return `$${(Math.round(value / 1000) * 1000).toLocaleString()}`;
    }
    return `$${Math.round(value).toLocaleString()}`;
  }

  // Basic numeric (best if precision is already set (e.g. to the hundreths))
  if (numberLayers.includes(layerId)) {
    return (value).toLocaleString();
  }

  // Fallback logic 
  if (value < 2) return `${Math.round(value * 100)}%`; 
  if (value >= 1500) return `$${(Math.round(value / 1000) * 1000).toLocaleString()}`;
  return `$${Math.round(value).toLocaleString()}`;
}


// Render legend from stops
function renderLegendFromStops(layerId) {
  const stops = getStopsFromLayer(layerId);
  const palette = palettesByLayer[layerId] || [];

  function getLabel(stop) {
    const match = palette.find(p => 
      (p.value === stop.value) || (p.color.toLowerCase() === stop.color.toLowerCase())
    );
    return match?.label || formatLegendLabel(stop.value, layerId); // fallback to data value if no label
  }

  //inject default text?? here??

  //prevent duplicates
  const seen = new Set();
  const uniqueStops = stops.filter(stop => {
    const label = getLabel(stop);
    const key = `${stop.color.toLowerCase()}|${label}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

// Generate HTML for the data-layer legend
const dataLayerHtml = uniqueStops.map((stop, index) => {
  const next = uniqueStops[index + 1];
  const label = getLabel(stop);

  // Check if this layer has custom labels defined in palettesByLayer
  const hasCustomLabels = palette.length > 0;

  // Show ranges if numeric AND no custom labels exist
  let displayLabel = label;
  const isNumeric = typeof stop.value === 'number';

  // Special handling for step expression default color
  if (stop.isDefaultStep && stop.upperBound !== undefined && !hasCustomLabels) {
    displayLabel = `< ${formatLegendLabel(stop.upperBound, layerId)}`;
  } else if (isNumeric && next && !hasCustomLabels) {
    // Don't show range for the first stop if it's the default step (already handled above)
    displayLabel = stop.isDefaultStep
      ? `< ${getLabel(next)}`
      : `${label} – ${getLabel(next)}`;
  } else if (isNumeric && index === uniqueStops.length - 1 && !hasCustomLabels) {
    displayLabel = `≥ ${label}`;
  }

  return `
    <div class="flex items-start gap-2 mb-2">
      <span class="w-3.5 h-3.5 inline-block rounded-sm flex-shrink-0 mt-0.5" style="background-color: ${stop.color};"></span>
      <span class="leading-tight">${displayLabel}</span>
    </div>
  `;
}).join('');

// Get display name from the sidebar label text
function getOverlayDisplayName(layerId) {
  const input = document.querySelector(`.overlay-toggle[value="${layerId}"]`);
  if (!input) return layerId;

  // Find the <span> containing the text inside the parent <label>
  const labelSpan = input.closest('label')?.querySelector('span.leading-snug');
  if (!labelSpan) return layerId;

  // Clone the span and remove any info icon elements
  const clone = labelSpan.cloneNode(true);
  const infoIcon = clone.querySelector('#transit-diversity-info-btn');
  if (infoIcon) {
    infoIcon.parentElement?.remove(); // Remove the parent span that contains the icon
  }

  return clone.textContent?.trim() || layerId;
}

function getOverlayColor(layerId) {
  const layer = map.getLayer(layerId);
  if (!layer) return '#999';

  const type = layer.type;
  let paintProp;

  if (type === 'circle') paintProp = 'circle-color';
  else if (type === 'line') paintProp = 'line-color';
  else if (type === 'fill') paintProp = 'fill-color';
  else return '#999';

  let paint = map.getPaintProperty(layerId, paintProp);
  if (!paint) return '#999';

  // if paint is a string, return it
  if (typeof paint === 'string') return paint;

  // if paint is an expression/array, get first color 
  if (Array.isArray(paint)) {
    const colorStop = paint.find(item => typeof item === 'string' && /^#|rgb|hsl/.test(item));
    if (colorStop) return colorStop;
  }

  return '#999'; // fallback
}



// Add overlay to legend
function addOverlayLegendEntry(layerId) {
  const legendContent = document.getElementById('legend-content');
  if (!legendContent) return;

  // add overlay header (once)
  if (!document.querySelector('#legend-overlays-header')) {
    legendContent.insertAdjacentHTML(
      'beforeend',
      `<div class="h-2"></div>
      <p id="legend-overlays-header" class="text-sm font-medium mb-1">Overlays</p>`
    );
  }


  // Avoid duplicates
  if (document.querySelector(`#legend-overlay-${layerId}`)) return;

  // Wait until layer exists
  if (!map.getLayer(layerId)) {
    map.once('idle', () => addOverlayLegendEntry(layerId));
    return;
  }

  const displayName = getOverlayDisplayName(layerId);
  const color = getOverlayColor(layerId);

  const overlayHtml = `
    <div id="legend-overlay-${layerId}" class="flex items-center gap-2 mt-1">
      <span class="w-3 h-3 inline-block rounded-full border border-gray-300"
            style="background-color: ${color};"></span>
      <span class="font-normal">${displayName}</span>
    </div>
  `;

  legendContent.insertAdjacentHTML('beforeend', overlayHtml);
}

// Remove overlay entry from legend
function removeOverlayLegendEntry(layerId) {
  const entry = document.getElementById(`legend-overlay-${layerId}`);
  if (entry) entry.remove();
}

// Full region zoom function
function zoomToFullRegion() {
    fetch('communityboundaries.geojson')
        .then(response => {
            if (!response.ok) throw new Error('Failed to fetch');
            return response.json();
        })
        .then(data => {
            const bounds = new mapboxgl.LngLatBounds();

            // Process all features
            data.features.forEach(feature => {
                if (feature.geometry.type === 'Polygon') {
                    feature.geometry.coordinates.forEach(ring => {
                        ring.forEach(coord => bounds.extend(coord));
                    });
                } else if (feature.geometry.type === 'MultiPolygon') {
                    feature.geometry.coordinates.forEach(polygon => {
                        polygon.forEach(ring => {
                            ring.forEach(coord => bounds.extend(coord));
                        });
                    });
                }
            });

            // Zoom to bounds with padding
            map.fitBounds(bounds, {
                padding: 50,
                duration: 1000
            });
        })
        .catch(error => {
            console.error('Error loading communityboundaries:', error);
            // Fallback: zoom to approximate Central MA region
            map.flyTo({
                center: [-71.9, 42.25],
                zoom: 9,
                duration: 1000
            });
        });
}

document.getElementById('clear-map').addEventListener('click', () => {
  const overlayInputs = document.querySelectorAll('.overlay-toggle');

  overlayInputs.forEach(input => {
    const layerId = input.value;
    const layer = map.getLayer(layerId);

    if (layer && map.getLayoutProperty(layerId, 'visibility') !== 'none') {
      map.setLayoutProperty(layerId, 'visibility', 'none');
    }

    input.checked = false; // uncheck toggle in UI
  });

// wipe the fills 
  map.getStyle().layers.forEach(layer => {
    if (layer.type === 'fill') {
      try {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      } catch (e) {
        console.warn(`Could not hide layer ${layer.id}:`, e);
      }
    }
  });

  // clear the legend panel
  const legendContent = document.getElementById('legend-content');
  if (legendContent) {
    legendContent.innerHTML = '';
  }

  // reset legend title to blank
  const legendTitle = document.getElementById('legend-title');
  if (legendTitle) {
    legendTitle.textContent = '';
  }

  // reset to gray basemap
  map.setStyle('mapbox://styles/communityscale/cmgicidwh007k01qdauae93b0');

  // remove any popups
  if (typeof popup !== 'undefined') {
    popup.remove();
  }
});
