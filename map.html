    /**
     * Calculate quintile breaks from a dataset
     * @param {Array} data - Array of feature objects
     * @param {string} property - Property name to calculate breaks for
     * @returns {Array} Array of 4 break values (20th, 40th, 60th, 80th percentiles) rounded to nearest 10
     */
    function calculateQuintileBreaks(data, property) {
        // Extract values and filter out null/undefined/NaN
        const values = data
            .map(f => f.properties ? f.properties[property] : f[property])
            .filter(v => v != null && !isNaN(v))
            .sort((a, b) => a - b);

        if (values.length === 0) {
            console.warn(`No valid values found for property: ${property}`);
            return [0, 0, 0, 0];
        }

        // Calculate quintile positions (20%, 40%, 60%, 80%)
        const getPercentile = (pct) => {
            const index = Math.floor(values.length * pct);
            return values[Math.min(index, values.length - 1)];
        };

        const breaks = [
            getPercentile(0.20),
            getPercentile(0.40),
            getPercentile(0.60),
            getPercentile(0.80)
        ];

        // Round to nearest 10
        const roundedBreaks = breaks.map(val => Math.round(val / 10) * 10);

        console.log(`Calculated breaks for ${property}:`, roundedBreaks);
        return roundedBreaks;
    }

    function updateDataLayer(layerType, attribute) {
        console.log('updateDataLayer called with:', layerType, attribute);

        // Close any open popups
        const popups = document.getElementsByClassName('mapboxgl-popup');
        if (popups.length) {
            for (let i = popups.length - 1; i >= 0; i--) {
                popups[i].remove();
            }
        }

        // Remove existing data layers
        if (map.getLayer('data-layer')) map.removeLayer('data-layer');

        if (!layerType || !attribute) {
            document.getElementById('legend').classList.add('hidden');
            currentDataLayer = null;
            currentLayerName = null;
            return;
        }

        currentDataLayer = layerType + ':' + attribute;

        // Determine where to insert the layer - before the first overlay layer so overlays appear on top of data
        // Layer order (bottom to top): basemap -> data layer -> overlays -> towns-outline -> basemap labels
        let insertBeforeLayer = null;

        // List of overlay layers (in order they should appear)
        const overlayLayerIds = [
            'subregion-central', 'subregion-north', 'subregion-northeast',
            'subregion-west', 'subregion-southwest', 'subregion-southeast',
            'bus-stops-layer', 'train-stops-layer', 'fair-ped-layer', 'good-ped-layer',
            'fair-transit-layer', 'good-transit-layer', 'transit-diversity-layer',
            'mf-byright-layer', 'mf-specialpermit-layer', 'exceeds-capacity-layer', 'excess-capacity-layer'
        ];

        // Find the first overlay layer that exists
        for (const overlayId of overlayLayerIds) {
            if (map.getLayer(overlayId)) {
                insertBeforeLayer = overlayId;
                break;
            }
        }

        // Fallback to towns-outline if no overlays exist
        if (!insertBeforeLayer && map.getLayer('towns-outline')) {
            insertBeforeLayer = 'towns-outline';
        }

        // Final fallback to first symbol layer
        if (!insertBeforeLayer) {
            const layers = map.getStyle().layers;
            for (const layer of layers) {
                if (layer.type === 'symbol') {
                    insertBeforeLayer = layer.id;
                    break;

    function updateLegend(layerType, attribute, legendData) {
        const legendTitle = document.getElementById('legend-title');
        const legendContent = document.getElementById('legend-content');
        const legend = document.getElementById('legend');

        let layerName = currentLayerName;
        if (!layerName) {
            const select = document.getElementById('layer-select');
            const selectedOption = select.options[select.selectedIndex];
            layerName = selectedOption.text;
            currentLayerName = layerName;
        }

        legendTitle.textContent = layerName;
        legendContent.innerHTML = '';

        if (legendData && legendData.length > 0) {
            legendData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';

                const colorBox = document.createElement('div');
                colorBox.className = 'w-4 h-4 rounded border border-gray-300 flex-shrink-0';
                colorBox.style.backgroundColor = item.color;

                const label = document.createElement('span');
                label.className = 'text-xs';
                label.textContent = item.label;

                div.appendChild(colorBox);
                div.appendChild(label);
                legendContent.appendChild(div);
            });
        } else {
            legendContent.innerHTML = '<p class="text-xs text-gray-600">Loading...</p>';
        }

        legend.classList.remove('hidden');
    }

    function updateAboutLayer(layerKey) {
        const layerDescription = document.getElementById('layer-description');

        const layerInfo = LAYER_INFO[layerKey];
        if (layerInfo) {
            let html = `<p class="mb-1"><strong>Source:</strong> ${layerInfo.source}</p>`;
            if (layerInfo.description) {
                html += `<p><strong>Note:</strong> ${layerInfo.description}</p>`;
            }
            layerDescription.innerHTML = html;
            layerDescription.classList.add('hidden');
        }
    }

    function switchBasemap(newStyle) {
        // Don't switch if we're already on this basemap
        if (currentBasemap === newStyle) {
            console.log('Already on basemap:', newStyle);
            return;
        }

        currentBasemap = newStyle;
        const savedLayerState = currentDataLayer;

        // Capture visible overlay states before switching
        const overlayLayers = [
            'towns-outline', 'subregion-central', 'subregion-north', 'subregion-northeast',
            'subregion-west', 'subregion-southwest', 'subregion-southeast',
            'bus-stops-layer', 'train-stops-layer', 'fair-ped-layer', 'good-ped-layer',
            'fair-transit-layer', 'good-transit-layer', 'transit-diversity-layer',
            'mf-byright-layer', 'mf-specialpermit-layer', 'exceeds-capacity-layer', 'excess-capacity-layer'
        ];
        const visibleOverlays = overlayLayers.filter(id => {
            const layer = map.getLayer(id);
            return layer && map.getLayoutProperty(id, 'visibility') === 'visible';
        });
        console.log('Visible overlays before switch:', visibleOverlays);

        map.setStyle(BASEMAP_STYLES[newStyle]);

        // Update button borders
        document.querySelectorAll('#basemap-style-thumbnails button').forEach(btn => {
            if (btn.dataset.style === newStyle) {
                btn.classList.remove('border-white');
                btn.classList.add('border-gray-500');
            } else {

            // Reload data

                .then(filterData => {

                    features.forEach(f => {
                        const geoid = f.properties?.GEOID || f.GEOID;
                        if (geoid) validTractsRD.add(geoid.toString());
                    });
                    return fetch('https://raw.githubusercontent.com/CommunityScale/CMRPC/refs/heads/main/rd_tracts_250731.json');

                .then(response => response.json())
                .then(data => {
                    data.forEach(f => {
                        const id = f.GEOID.toString();
                        if (validTractsRD.has(id)) {
                            map.setFeatureState(
                                { source: 'tracts-source', sourceLayer: 'tracts', id: id },
                                {

                    const [layerType, attribute] = savedLayerState.split(':');

    // Click handler for popups
    map.on('click', function(e) {
        // Check if a data layer is visible
        if (!currentDataLayer) {
            // If no data layer, check for town click
            const townFeatures = map.queryRenderedFeatures(e.point, { layers: ['towns-outline', 'town-labels'] });
            if (townFeatures.length) {
                const town = townFeatures[0].properties.TOWN;
                new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <div class="popup-content">
                            <div class="popup-header">${town}</div>
                            <p>Community in the CMRPC region</p>
                        </div>
                    `)
                    .addTo(map);
            }
            return;
        }

        // Query features from the data layer
        const features = map.queryRenderedFeatures(e.point, { layers: ['data-layer'] });

        if (!features.length) return;

        const feature = features[0];
        const attributes = feature.properties;
        const featureState = map.getFeatureState({
            source: feature.source,
            sourceLayer: feature.sourceLayer,
            id: feature.id
        });

        // Merge properties and feature state
        const allData = { ...attributes, ...featureState };

        let html = '';
        const [layerType, attribute] = currentDataLayer.split(':');

        // Build popup HTML based on current layer
        switch(currentDataLayer) {
            case 'tracts:medIncome': {
                const income = allData.medIncome;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${income != null ? `Annual median household income: $${income.toLocaleString()} (2023 USD).` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'tracts:pctCostBurdenedRenters': {
                const pctrent30_23 = allData.pctrent30_23;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${pctrent30_23 != null ? `${Math.round(pctrent30_23 * 1000) / 10}% of renters in ${attributes.NAME} spend more than 30% of income on housing costs.` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'tracts:pctCostBurdenedOwners': {
                const pctowned30_23 = allData.pctowned30_23;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${pctowned30_23 != null ? `${Math.round(pctowned30_23 * 1000) / 10}% of homeowners in ${attributes.NAME} spend more than 30% of income on housing costs.` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'tracts:rdAge': {
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${allData.rd_seniors != null ? `Displacement risk for seniors: ${Math.round(allData.rd_seniors*100)} out of 100, with 100 indicating highest risk.` : 'No score available.'}</p>
                    </div>`;
                break;
            }

            case 'tracts:rdRace': {
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${allData.rd_nonWhitePops != null ? `Displacement risk for nonwhite population: ${Math.round(allData.rd_nonWhitePops*100)} out of 100, with 100 indicating highest risk.` : 'No score available.'}</p>
                    </div>`;
                break;
            }

            case 'tracts:mva': {
                const condition = allData.mva;
                const conditionText = {
                    'HDCQ': `${attributes.NAME} is a historically disinvested area and is changing quickly.`,
                    'HDKU': `${attributes.NAME} is a historically disinvested area and is keeping up.`,
                    'HDNI': `${attributes.NAME} is a historically disinvested area and has not improved over the past five years.`,
                    'OKCQ': `${attributes.NAME} has been doing alright and is changing quickly.`,
                    'OKKU': `${attributes.NAME} has been doing alright and is keeping up.`,
                    'OKNI': `${attributes.NAME} has been doing alright but has not improved over the past five years.`,
                    'LDCQ': `${attributes.NAME} is a lower-demand area with competitive quality.`,
                    'LDKU': `${attributes.NAME} is a lower-demand area keeping up.`,
                    'LDNI': `${attributes.NAME} is a lower-demand area needing improvement.`
                };
                const displayCondition = conditionText[condition] || 'No available data.';
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>${displayCondition}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-HT': {
                const htCost = allData.H_T_renters;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${htCost != null ? `Monthly housing + transportation costs for renters: $${Math.round(htCost).toLocaleString()}` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-HT-owner': {
                const htCostOwner = allData.H_T_owner;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${htCostOwner != null ? `Monthly housing + transportation costs for homeowners: $${Math.round(htCostOwner).toLocaleString()}` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-2veh-owner': {
                const affordabilityShare = allData.own_2veh_2_3_bd_AMI100_3p_cost_sh;
                const affordabilityPct = affordabilityShare != null ? Math.round(affordabilityShare * 100) : null;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${affordabilityPct != null ? `A 3+ person household with 2 cars looking for a 2-3 bedroom home, making 100% AMI as a household, is estimated to spend ${affordabilityPct}% of their monthly income on housing and transportation costs here.` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-ownership': {
                const cost_ownership = allData.monthly_ownership_costs_overall;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${cost_ownership != null ? `Monthly housing costs for homeowners: $${Math.round(cost_ownership).toLocaleString()}` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-rental': {
                const cost_rental = allData.monthly_rental_costs_overall;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${cost_rental != null ? `Monthly housing costs for renters: $${Math.round(cost_rental).toLocaleString()}` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:costs-transport': {
                const avg_transport_cost = allData.monthly_t_costs_avg_hh;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.GEO_ID_clean || allData.geoid || ''}</div>
                        <p>${avg_transport_cost != null ? `Average monthly transportation costs across household type: $${Math.round(avg_transport_cost).toLocaleString()}` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'bg:transport-diversity': {
                const transport_diversity = allData.transpo_diverse_perc_marginal;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Block Group ${allData.geoid || allData.GEO_ID_clean || ''}</div>
                        <p>${transport_diversity != null ? `${Math.round(transport_diversity * 1000) / 10}% of parcels in this block group are considered "transportation diverse."` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'zip:currentZHVI': {
                const currentZHVI = allData.zhvi25;
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Zipcode ${attributes.ZCTA5 || ''}</div>
                        <p>${currentZHVI != null ? `Typical home price: $${currentZHVI.toLocaleString()} (2025 USD).` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'zip:chZHVI': {
                const pctChangeZhvi = Math.round(allData.chZhvi * 1000) / 10;
                const displayPctChangeZhvi = allData.chZhvi != null ? `This zipcode saw a ${pctChangeZhvi}% change in typical home price (2020-2025).` : 'No available data.';
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Zipcode ${attributes.ZCTA5 || ''}</div>
                        <p>${displayPctChangeZhvi}</p>
                    </div>`;
                break;
            }

            case 'ctysds:pctHH': {
                const pctChangeHH = allData.pctChangeHH;
                const roundedPctChangeHH = Math.round(pctChangeHH * 1000) / 10;
                const displayPctChangeHH = pctChangeHH != null ? `${attributes.NAME} saw a ${roundedPctChangeHH}% change in the number of households (2015-2023).` : 'No available data.';
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'County Subdivision'}</div>
                        <p>${displayPctChangeHH}</p>
                    </div>`;
                break;
            }

            case 'parcels:landuse': {
                const propClassVal = allData.useCode;
                const propClassMatch = landUsePalette.find(entry => entry.key === propClassVal);
                const displayPropClass = propClassMatch ? propClassMatch.label : "data unavailable";
                const parcelName = attributes.SiteAddress || 'Parcel';
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${parcelName}</div>
                        <p>Current land use designation: ${displayPropClass}.</p>
                    </div>`;
                break;
            }

            case 'parcels:density': {
                const DUA = allData.density != null ? Math.round(allData.density * 10) / 10 : null;
                const parcelName = attributes.SiteAddress || 'Parcel';
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${parcelName}</div>
                        <p>${DUA != null ? `This parcel is built out at a residential density of ${DUA} units per acre.` : 'No available data.'}</p>
                    </div>`;
                break;
            }

            case 'buildable:land': {
                const buildClass = allData.clss;
                const buildableMatch = buildablePalette.find(entry => entry.key === buildClass);
                const displayBuildable = buildableMatch ? buildableMatch.label : "Unknown";
                html = `
                    <div class="popup-content">
                        <div class="popup-header">Land Classification</div>
                        <p>${displayBuildable}</p>
                    </div>`;
                break;
            }

            case 'admin:tracts': {
                html = `
                    <div class="popup-content">
                        <div class="popup-header">${attributes.NAME || 'Census Tract'}</div>
                        <p>GEOID: ${attributes.GEOID || 'N/A'}</p>
                    </div>`;
                break;
            }

            default:
                html = `
                    <div class="popup-content">
                        <p>Click a feature for more information.</p>
                    </div>`;
        }

        if (html) {
            new mapboxgl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(html)
                .addTo(map);
        }
    });
</script>

</body>
</html>
